[project]
name = "nexus_zkt_integration"
authors = [
    { name = "Abbas Raza", email = "abbasraza0444@gmail.com"}
]
description = "Pull attendance punches from ZKTeco biometric devices straight into Employee Checkin, across every door, on Frappe HRMS 15 and 16."
requires-python = ">=3.10"
readme = "README.md"
license = { file = "license.txt" }
keywords = [
    "frappe", "erpnext", "hrms", "attendance", "biometric", "zkteco", "zk",
    "employee-checkin", "time-attendance", "fingerprint", "access-control",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
    "Topic :: Office/Business :: Scheduling",
]
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    "pyzk~=0.9",
]

[project.urls]
Homepage = "https://github.com/abbas0444/nexus_zkt_integration"
Repository = "https://github.com/abbas0444/nexus_zkt_integration"
Documentation = "https://github.com/abbas0444/nexus_zkt_integration/wiki"
Changelog = "https://github.com/abbas0444/nexus_zkt_integration/blob/version-16/CHANGELOG.md"
"Bug Tracker" = "https://github.com/abbas0444/nexus_zkt_integration/issues"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# What this app needs to run. Frappe Cloud reads the frappe line to decide
# which Frappe version a branch belongs to, and bench checks every line on
# get-app. HRMS is where Employee Checkin lives, and HRMS needs ERPNext.
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
hrms = ">=15.0.0,<16.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["README.md"]

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
